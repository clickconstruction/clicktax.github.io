name: Deploy MCP Worker
on:
  push:
    branches: [main]
    paths: ["apps/mcp/**", "packages/forms/**", "package-lock.json", ".github/workflows/deploy-mcp.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy with wrangler
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7cad448b9713f42ee58be38cfe9ddaf6
          workingDirectory: apps/mcp
          command: deploy
      - name: Skipped
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN secret not set; skipping deploy. Run 'npx wrangler deploy' from apps/mcp locally."
