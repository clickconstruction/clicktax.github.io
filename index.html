<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClickTax</title>
  <meta name="description" content="ClickTax — a Click Construction product.">
  <style>
    :root { --bg: #ffffff; --fg: #111111; --muted: #666666; --accent: #0b5fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0f11; --fg: #f2f2f2; --muted: #9a9a9a; --accent: #5b8cff; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: grid; place-items: center; padding: 16px;
    }
    main { text-align: center; max-width: 36rem; }
    h1 { font-size: clamp(2.25rem, 8vw, 4rem); letter-spacing: -0.02em; margin: 0 0 .5rem; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); margin: .25rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>Click<span>Tax</span></h1>
    <p>Coming soon.</p>
    <p>A Click Construction product.</p>
  </main>
</body>
</html>
